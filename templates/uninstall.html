<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Uninstall Clipify AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #050507;
      color: #f4f4f6;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #bgCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: radial-gradient(circle at 50% 45%, black 35%, transparent 85%);
    }
    .shell {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: rgba(11, 11, 15, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.78), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
    }
    .head {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    .logo {
      width: 48px;
      height: 48px;
      border-radius: 13px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: #0d0d11;
      object-fit: cover;
      flex-shrink: 0;
    }
    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
    }
    .ver-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.06);
      color: #e4e4e7;
      letter-spacing: 0.04em;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-top: 4px;
      line-height: 1.45;
    }
    .path-box {
      font-size: 0.75rem;
      color: #a1a1aa;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 9px 12px;
      margin-bottom: 18px;
      word-break: break-all;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }
    .opt-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 13px 15px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.09);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      user-select: none;
    }
    .opt-row:hover {
      background: rgba(255, 255, 255, 0.055);
      border-color: rgba(255, 255, 255, 0.22);
    }
    .opt-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #ffffff;
    }
    .opt-desc {
      font-size: 0.76rem;
      color: #9ca3af;
      margin-top: 2px;
      line-height: 1.35;
    }
    /* Clean non-bugged toggle switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }
    .slider {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.18);
      transition: background 0.2s, border-color 0.2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 2px;
      top: 2px;
      border-radius: 50%;
      background: #a1a1aa;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .switch input:checked + .slider {
      background: #ffffff;
      border-color: #ffffff;
    }
    .switch input:checked + .slider::before {
      transform: translateX(20px);
      background: #050507;
    }
    .discord-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      margin-bottom: 20px;
    }
    .discord-copy {
      font-size: 0.79rem;
      color: #d4d4d8;
      line-height: 1.4;
    }
    .discord-copy b { color: #ffffff; }
    .btn-discord {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-discord:hover {
      background: #ffffff;
      color: #050507;
      border-color: #ffffff;
    }
    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }
    .btn {
      padding: 11px 18px;
      border-radius: 11px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.16);
      transition: all 0.2s ease;
    }
    .btn-cancel {
      background: rgba(255, 255, 255, 0.05);
      color: #e4e4e7;
    }
    .btn-cancel:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.35);
    }
    .btn-uninstall {
      background: #ffffff;
      color: #050507;
      border-color: #ffffff;
    }
    .btn-uninstall:hover {
      background: #e4e4e7;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status-box {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-size: 0.82rem;
      color: #e4e4e7;
      line-height: 1.45;
    }
    .status-box.visible { display: block; }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  <div class="bg-grid"></div>
  <main class="shell">
    <section class="card">
      <div class="head">
        <img class="logo" src="/static/icon.png" alt="Clipify AI" onerror="this.style.display='none'" />
        <div>
          <div class="title-row">
            <h1>Uninstall Clipify AI</h1>
            <span class="ver-pill" id="verPill">v{{VERSION}}</span>
          </div>
          <p class="subtitle">Choose what to remove from this PC. Your generated Shorts and AI models are kept safe by default.</p>
        </div>
      </div>

      <div class="path-box" id="installPathBox">Install folder: {{INSTALL_DIR}}</div>

      <div class="options" id="optionsList">
        <label class="opt-row" for="optOutputs">
          <div>
            <div class="opt-title">Remove generated Shorts &amp; outputs</div>
            <div class="opt-desc">Delete rendered clips and project output folders created by Clipify AI.</div>
          </div>
          <span class="switch">
            <input type="checkbox" id="optOutputs" />
            <span class="slider"></span>
          </span>
        </label>

        <label class="opt-row" for="optOllama">
          <div>
            <div class="opt-title">Remove Ollama &amp; downloaded AI models</div>
            <div class="opt-desc">Remove local Ollama models (~/.ollama) and uninstall Ollama if present.</div>
          </div>
          <span class="switch">
            <input type="checkbox" id="optOllama" />
            <span class="slider"></span>
          </span>
        </label>

        <label class="opt-row" for="optCache">
          <div>
            <div class="opt-title">Remove app settings &amp; transcription cache</div>
            <div class="opt-desc">Clear cached Whisper transcripts, imported source videos, and local preferences.</div>
          </div>
          <span class="switch">
            <input type="checkbox" id="optCache" />
            <span class="slider"></span>
          </span>
        </label>
      </div>

      <div class="discord-banner">
        <div class="discord-copy">
          <b>Running into a bug or crash?</b><br />
          Tell us on Discord so we can fix it fast.
        </div>
        <button type="button" class="btn-discord" id="btnDiscord">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
          Join Discord
        </button>
      </div>

      <div class="actions" id="actionRow">
        <button type="button" class="btn btn-cancel" id="btnCancel">Cancel</button>
        <button type="button" class="btn btn-uninstall" id="btnUninstall">Uninstall Clipify AI</button>
      </div>

      <div class="status-box" id="statusBox"></div>
    </section>
  </main>

  <script>
    // Monochrome animated starfield background
    (function initStars() {
      const canvas = document.getElementById('bgCanvas');
      const ctx = canvas.getContext('2d');
      let w = 0, h = 0;
      const dots = Array.from({ length: 85 }, () => ({
        x: Math.random(),
        y: Math.random(),
        r: Math.random() * 1.6 + 0.5,
        vx: (Math.random() - 0.5) * 0.00028,
        vy: (Math.random() - 0.5) * 0.00028,
        a: Math.random() * 0.6 + 0.25,
        p: Math.random() * Math.PI * 2
      }));
      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();
      function tick(t) {
        ctx.clearRect(0, 0, w, h);
        for (const d of dots) {
          d.x = (d.x + d.vx + 1) % 1;
          d.y = (d.y + d.vy + 1) % 1;
          const alpha = d.a * (0.65 + 0.35 * Math.sin(t * 0.002 + d.p));
          ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(3)})`;
          ctx.beginPath();
          ctx.arc(d.x * w, d.y * h, d.r, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();

    const btnDiscord = document.getElementById('btnDiscord');
    const btnCancel = document.getElementById('btnCancel');
    const btnUninstall = document.getElementById('btnUninstall');
    const statusBox = document.getElementById('statusBox');

    btnDiscord.addEventListener('click', async () => {
      try {
        await fetch('/api/open-discord', { method: 'POST' });
      } catch (_) {
        window.open('https://discord.gg/5ZBsasgryX', '_blank', 'noopener,noreferrer');
      }
    });

    btnCancel.addEventListener('click', async () => {
      try { await fetch('/api/cancel', { method: 'POST' }); } catch (_) {}
      window.close();
    });

    btnUninstall.addEventListener('click', async () => {
      btnUninstall.disabled = true;
      btnCancel.disabled = true;
      btnUninstall.textContent = 'Uninstalling…';
      statusBox.classList.add('visible');
      statusBox.textContent = 'Stopping Clipify AI background processes and removing application files…';
      try {
        const res = await fetch('/api/uninstall', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            remove_outputs: document.getElementById('optOutputs').checked,
            remove_ollama: document.getElementById('optOllama').checked,
            remove_cache: document.getElementById('optCache').checked,
          })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'Uninstall failed');
        statusBox.innerHTML = '<b>✓ Clipify AI has been uninstalled.</b><br/>' + (data.summary || 'You can close this window now.');
        btnUninstall.textContent = 'Done';
        btnCancel.disabled = false;
        btnCancel.textContent = 'Close';
      } catch (err) {
        statusBox.textContent = 'Error: ' + err.message;
        btnUninstall.disabled = false;
        btnCancel.disabled = false;
        btnUninstall.textContent = 'Retry Uninstall';
      }
    });
  </script>
</body>
</html>
